<svg viewBox="0 0 540 180" fill="none" xmlns="http://www.w3.org/2000/svg" className="h-full w-auto">
  <defs>
    <linearGradient id="synapticGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pulseLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- Stylized Synaptic Neuron 'S' Emblem -->
  <g transform="translate(10, 5)">
    <!-- Main spine curve of S -->
    <path
      d="M135 48 C 110 32, 70 36, 62 68 C 55 96, 115 102, 102 136 C 92 160, 58 162, 38 144"
      stroke="url(#synapticGrad)"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Upper radiating axon dendrite branches -->
    <path d="M85 46 C 105 35, 125 35, 148 38" stroke="url(#synapticGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M102 55 C 122 52, 142 62, 158 64" stroke="url(#synapticGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M112 74 C 130 84, 142 98, 155 106" stroke="url(#synapticGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Upper terminal synaptic nodes -->
    <circle cx="152" cy="38" r="9" fill="url(#nodeGrad)" />
    <circle cx="163" cy="65" r="8" fill="url(#nodeGrad)" />
    <circle cx="158" cy="107" r="7.5" fill="url(#nodeGrad)" />

    <!-- Lower radiating axon dendrite branches -->
    <path d="M78 128 C 58 138, 42 142, 22 142" stroke="url(#synapticGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M86 138 C 72 152, 54 165, 34 175" stroke="url(#synapticGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M96 142 C 90 162, 78 178, 62 192" stroke="url(#synapticGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Lower terminal synaptic nodes -->
    <circle cx="16" cy="142" r="8.5" fill="url(#nodeGrad)" />
    <circle cx="30" cy="177" r="8" fill="url(#nodeGrad)" />
    <circle cx="62" cy="195" r="7.5" fill="url(#nodeGrad)" />
  </g>

  <!-- Wordmark 'ynaptic' aligned with the 'S' spine -->
  <text
    x="172"
    y="126"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="82"
    font-weight="600"
    letter-spacing="-1.5px"
    fill="#0f172a"
  >
    ynaptic
  </text>

  <!-- EKG / Heartbeat pulse underline -->
  <path
    d="M 192 148 L 305 148 L 315 160 L 325 136 L 335 156 L 342 148 L 475 148"
    stroke="url(#pulseLineGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
